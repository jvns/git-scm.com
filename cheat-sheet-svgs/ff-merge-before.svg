<svg viewBox="-0.5 -0.5 35 9" xmlns="http://www.w3.org/2000/svg">
  <style>
    .commit rect { fill: none; stroke: black; stroke-width: 0.2; width: 3px; height: 3px; }
    .commit text { text-anchor: middle; transform: translate(1.5px, 2px);}
    line { stroke: black; stroke-width: 0.2; }
    text { font-family: monospace; font-size: 1.6px; font-weight: bold; }
    .commit .highlight { stroke: #ff69b4; }
  </style>
  <!-- linear commits A -> B -> C -> D -> E -->
  <g class="commit" transform="translate(0, 3)">
    <rect/><text>A</text>
    <line x1="3" y1="1.5" x2="5" y2="1.5"/>
  </g>
  <g class="commit" transform="translate(5, 3)">
    <rect/><text>B</text>
    <line x1="3" y1="1.5" x2="5" y2="1.5"/>
  </g>
  <g class="commit" transform="translate(10, 3)">
    <rect/><text>C</text>
    <line x1="3" y1="1.5" x2="5" y2="1.5"/>
  </g>
  <g class="commit" transform="translate(15, 3)">
    <rect/><text>D</text>
    <line x1="3" y1="1.5" x2="5" y2="1.5"/>
  </g>
  <g class="commit" transform="translate(20, 3)">
    <rect/><text>E</text>
  </g>
  <!-- branch annotation -->
  <g transform="translate(21.5, 1.5)">
    <polygon points="0,1.25 -0.5,0.25 0.5,0.25" fill="black"/>
    <text x="0" y="0" text-anchor="middle">dev</text>
  </g>

  <g transform="translate(11.5, 1.5)">
    <polygon points="0,1.25 -0.5,0.25 0.5,0.25" fill="black"/>
    <text x="0" y="0" text-anchor="middle">main</text>
  </g>
</svg>
